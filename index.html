<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Sad Darsana - Canvas Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        #gameCanvas {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100vh;
            /* Aspect ratio 4:3 */
            aspect-ratio: 4/3;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Logical resolution
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;

        // --- GLOBAL STATE ---
        let state = {
            scene: 'home', // home, tutorial, map, lesson, quiz, finalQuest, result
            xp: 0,
            completed: [],
            currentLessonId: null,
            fqCurrentIndex: 0,
            fqLives: 3,
            mouseX: 0,
            mouseY: 0,
            time: 0,
            modal: null // {title, msg, type, onClose}
        };

        // UI Manager for hit detection
        let uiElements = [];

        // --- DATA ---
        const darsanaData = [

                tokoh: 'Rsi Gautama',
                focus: 'Logika & Penalaran',
                concept: 'Nyaya adalah sistem filsafat yang menitikberatkan pada logika dan analisis. Mengajarkan cara berpikir logis, membedakan pengetahuan yang benar dan keliru (Pramana).',
                application: 'Memeriksa sumber dan bukti sebelum mempercayai informasi/berita hoaks.',
                badge: 'Sang Pemikir',
                quiz: {
                    q: 'Menganalisis informasi dengan logika adalah penerapan ajaran...',
                    opts: ['Yoga', 'Nyaya', 'Mimamsa', 'Vedanta'],
                    ans: 1
                }
            },
            {
                id: 'vaiseshika', name: 'Vaiseshika', icon: '🧱', color: '#34d399',
                x: 400, y: 250,
                tokoh: 'Rsi Kanada',
                focus: 'Hakikat Realitas & Kategori',
                concept: 'Memberikan perhatian terhadap hakikat alam semesta dan mengelompokkan kategori materi. Teori atom (Paramanu) berasal dari ajaran ini.',
                application: 'Kemampuan mengelompokkan dan berpikir sistematis saat melakukan penelitian.',
                badge: 'Sang Pengamat',
                quiz: {
                    q: 'Tokoh yang mengajarkan pengkategorian realitas (Vaiseshika) adalah...',
                    opts: ['Rsi Patanjali', 'Rsi Jaimini', 'Rsi Kanada', 'Rsi Kapila'],
                    ans: 2
                }
            },
            {
                id: 'samkhya', name: 'Samkhya', icon: '☯️', color: '#c084fc',
                x: 600, y: 250,
                tokoh: 'Rsi Kapila',
                focus: 'Purusa & Prakrti',
                concept: 'Menjelaskan realitas terbentuk dari Purusa (asas kesadaran/roh) dan Prakrti (asas materi). Ini adalah filsafat tertua.',
                application: 'Menyadari hidup butuh keseimbangan materi dan kesadaran spiritual.',
                badge: 'Sang Penyelaras',
                quiz: {
                    q: 'Dua prinsip utama pembentukan alam semesta menurut Samkhya adalah...',

                }
            },
            {
                id: 'yoga', name: 'Yoga', icon: '🧘', color: '#2dd4bf',
                x: 200, y: 420,
                tokoh: 'Rsi Patanjali',
                focus: 'Disiplin & Pengendalian',
                concept: 'Erat dengan praktik disiplin, pengendalian pikiran, konsentrasi, dan meditasi untuk mencapai kelepasan (Moksa).',
                application: 'Mengendalikan emosi saat marah dan fokus saat belajar.',

                quiz: {

                    opts: ['Nyaya', 'Vaiseshika', 'Mimamsa', 'Yoga'],

                }
            },
            {
                id: 'mimamsa', name: 'Mimamsa', icon: '🔥', color: '#fb923c',
                x: 400, y: 420,
                tokoh: 'Rsi Jaimini',
                focus: 'Kewajiban & Ritual',
                concept: 'Fokus pada bagian Karma Kanda dari Weda. Menekankan pentingnya pelaksanaan kewajiban (Dharma) dan tindakan keagamaan.',
                application: 'Melaksanakan kewajiban sebagai siswa dan sembahyang dengan tulus.',
                badge: 'Sang Pelaksana',
                quiz: {
                    q: 'Fokus utama dari ajaran Mimamsa (Rsi Jaimini) adalah...',
                    opts: ['Meditasi', 'Logika', 'Pelaksanaan kewajiban (Dharma)', 'Pembebasan'],
                    ans: 2
                }
            },
            {
                id: 'vedanta', name: 'Vedanta', icon: '♾️', color: '#fb7185',
                x: 600, y: 420,
                tokoh: 'Badarayana (Vyasa)',
                focus: 'Realitas Tertinggi',
                concept: 'Vedanta berarti "akhir Weda" (Upanisad). Membahas hakikat Atman (jiwa), Brahman (Tuhan), dan pembebasan abadi.',
                application: 'Melakukan refleksi diri mengenai hakikat diri dan hubungan dengan Tuhan.',
                badge: 'Sang Bijaksana',
                quiz: {
                    q: 'Vedanta sangat erat hubungannya dengan bagian akhir Weda, yaitu...',
                    opts: ['Reg Veda', 'Ayurveda', 'Upanisad', 'Purana'],
                    ans: 2
                }
            }
        ];

        const finalQuestData = [
            {
                q: "Istilah untuk 6 sistem filsafat Hindu adalah...",
                opts: ["Catur Marga", "Sad Darsana", "Panca Sradha", "Tri Hita Karana"],
                ans: 1
            },
            {
                q: "Pasangan tokoh dan aliran yang BENAR adalah...",
                opts: ["Rsi Kanada - Yoga", "Rsi Gautama - Samkhya", "Rsi Patanjali - Yoga", "Rsi Jaimini - Vaiseshika"],
                ans: 2
            },
            {
                q: "Belajar daripada main game karena sadar kewajiban mencerminkan Darsana...",
                opts: ["Mimamsa", "Nyaya", "Vedanta", "Vaiseshika"],
                ans: 0
            }
        ];

        // --- BACKGROUND PARTICLES ---
        const stars = Array.from({length: 100}, () => ({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * GAME_HEIGHT,
            size: Math.random() * 2,
            speed: Math.random() * 0.5 + 0.1
        }));

        // --- DRAWING HELPERS ---
        function drawRoundRect(x, y, w, h, radius, fill, stroke = null, shadow = false) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            
            if (shadow) {
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
            } else {
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }

            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.shadowColor = 'transparent'; // reset
        }

        function drawText(text, x, y, font, color, align = 'left', baseline = 'top') {
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = align;
            ctx.textBaseline = baseline;
            ctx.fillText(text, x, y);
        }

        function wrapText(text, x, y, maxWidth, lineHeight, font, color, align='left') {
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = align;
            ctx.textBaseline = 'top';
            
            let words = text.split(' ');
            let line = '';
            let currentY = y;

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, align === 'center' ? x + maxWidth/2 : x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, align === 'center' ? x + maxWidth/2 : x, currentY);
            return currentY + lineHeight;
        }

        // --- UI COMPONENT BUILDER ---
        function addButton(text, x, y, w, h, bgPrimary, bgHover, textColor, onClick) {
            const isHover = state.mouseX >= x && state.mouseX <= x + w && 
                            state.mouseY >= y && state.mouseY <= y + h && !state.modal;
            
            const currentBg = isHover ? bgHover : bgPrimary;
            const offsetY = isHover ? 2 : 0;
            
            drawRoundRect(x, y + offsetY, w, h, 15, currentBg, null, !isHover);
            drawText(text, x + w/2, y + h/2 + offsetY, "bold 20px Arial", textColor, "center", "middle");

            uiElements.push({x, y, w, h, onClick});
        }

        // --- SCENES ---
        function renderHome() {
            // Title Animation
            const floatY = Math.sin(state.time * 0.005) * 10;
            
            drawText('🕉️', GAME_WIDTH/2, 120 + floatY, '60px Arial', '#fbbf24', 'center');
            
            ctx.font = "bold 48px Arial";
            ctx.textAlign = "center";
            // Gradient text
            let gradient = ctx.createLinearGradient(0, 150, 0, 220);
            gradient.addColorStop(0, "#fde68a");
            gradient.addColorStop(0.5, "#fbbf24");
            gradient.addColorStop(1, "#d97706");
            ctx.fillStyle = gradient;
            ctx.fillText("JELAJAH SAD DARSANA", GAME_WIDTH/2, 220);

            wrapText("Temukan hakikat kehidupan, pengetahuan, dan kebenaran melalui 6 sistem filsafat Hindu. Jadilah sang bijaksana!", 150, 260, 500, 24, "18px Arial", "#cbd5e1", "center");

            addButton("MULAI PETUALANGAN", GAME_WIDTH/2 - 150, 360, 300, 60, "#d97706", "#b45309", "#ffffff", () => {
                state.scene = 'map';
            });

            addButton("PETUNJUK", GAME_WIDTH/2 - 100, 440, 200, 50, "#2563eb", "#1d4ed8", "#ffffff", () => {
                state.scene = 'tutorial';
            });
        }

        function renderTutorial() {
            drawRoundRect(100, 50, 600, 500, 20, "rgba(30, 41, 59, 0.9)", "#475569", true);
            drawText("📜 Petunjuk & Tujuan", 400, 80, "bold 28px Arial", "#fbbf24", "center");
            
            let y = 140;
            drawText("Tujuan Pembelajaran:", 140, y, "bold 20px Arial", "#93c5fd");
            y += 30;
            wrapText("- Menjelaskan pengertian Darsana.", 140, y, 520, 24, "16px Arial", "#e2e8f0"); y += 24;
            wrapText("- Mengidentifikasi 6 sistem filsafat Hindu.", 140, y, 520, 24, "16px Arial", "#e2e8f0"); y += 24;
            wrapText("- Menghubungkan pemikiran dengan keseharian.", 140, y, 520, 24, "16px Arial", "#e2e8f0"); y += 40;

            drawText("Cara Bermain:", 140, y, "bold 20px Arial", "#6ee7b7");
            y += 30;
            wrapText("1. Pilih level (Darsana) di Peta Penjelajahan.", 140, y, 520, 24, "16px Arial", "#e2e8f0"); y += 24;
            wrapText("2. Pelajari materi dan selesaikan Mini Challenge.", 140, y, 520, 24, "16px Arial", "#e2e8f0"); y += 24;
            wrapText("3. Kumpulkan 6 Badge untuk membuka Final Quest.", 140, y, 520, 24, "16px Arial", "#e2e8f0"); y += 24;

            addButton("MENGERTI", 300, 470, 200, 50, "#d97706", "#b45309", "#ffffff", () => {
                state.scene = 'home';
            });
        }

        function renderMap() {
            // Header Stats
            drawRoundRect(20, 20, 760, 60, 10, "rgba(30, 41, 59, 0.8)", "#475569");
            
            // Home button inside header
            addButton("🏠", 30, 30, 40, 40, "#475569", "#334155", "#fff", () => state.scene = 'home');
            
            drawText("PLAYER STATS", 90, 30, "bold 12px Arial", "#94a3b8");
            drawText(`⭐ ${state.xp} XP`, 90, 45, "bold 20px Arial", "#fbbf24");
            
            drawText("BADGES", 740, 30, "bold 12px Arial", "#94a3b8", "right");
            drawText(`${state.completed.length}/6`, 740, 45, "bold 20px Arial", "#93c5fd", "right");

            drawText("PETA SAD DARSANA", 400, 120, "black 32px Arial", "#ffffff", "center");

            // Draw Nodes
            darsanaData.forEach(node => {
                const isCompleted = state.completed.includes(node.id);
                const r = 45;
                const isHover = !state.modal && Math.hypot(state.mouseX - node.x, state.mouseY - node.y) < r;
                const currentR = isHover ? r + 5 : r;

                // Connection line (visual only, from center top)
                ctx.beginPath();
                ctx.moveTo(400, 150);
                ctx.lineTo(node.x, node.y - currentR);
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Circle Background
                ctx.beginPath();
                ctx.arc(node.x, node.y, currentR, 0, Math.PI * 2);
                ctx.fillStyle = isCompleted ? "#334155" : "rgba(30,41,59,0.9)";
                ctx.fill();
                ctx.strokeStyle = isCompleted ? "#fbbf24" : node.color;
                ctx.lineWidth = 4;
                ctx.stroke();

                // Icon & Text
                drawText(node.icon, node.x, node.y, `${isHover ? 40 : 36}px Arial`, "#fff", "center", "middle");
                drawText(node.name, node.x, node.y + r + 15, "bold 16px Arial", isCompleted ? "#fbbf24" : "#e2e8f0", "center");

                if (isCompleted) {
                    drawText("✅", node.x + r - 10, node.y + r - 10, "16px Arial", "#fff", "center", "middle");
                }

                // Add to UI elements (using bounding box for simplicity)
                uiElements.push({
                    x: node.x - r, y: node.y - r, w: r*2, h: r*2,
                    onClick: () => {
                        state.currentLessonId = node.id;
                        state.scene = 'lesson';
                    }
                });
            });

            // Final Quest Button
            const fqUnlocked = state.completed.length >= 6;
            if (fqUnlocked) {
                addButton("⚔️ FINAL QUEST", 250, 520, 300, 50, "#dc2626", "#b91c1c", "#ffffff", () => {
                    state.fqCurrentIndex = 0;
                    state.fqLives = 3;
                    state.scene = 'finalQuest';
                });
            } else {
                drawRoundRect(250, 520, 300, 50, 15, "#475569", null);
                drawText("🔒 FINAL QUEST", 400, 545, "bold 20px Arial", "#94a3b8", "center", "middle");
                drawText("Kumpulkan 6 Badge untuk membuka", 400, 585, "14px Arial", "#94a3b8", "center");
            }
        }

        function renderLesson() {
            const data = darsanaData.find(d => d.id === state.currentLessonId);
            if(!data) return;

            drawRoundRect(50, 40, 700, 520, 20, "rgba(30, 41, 59, 0.95)", "#475569", true);
            
            // Close btn
            addButton("✖", 700, 50, 30, 30, "transparent", "#ef4444", "#94a3b8", () => state.scene = 'map');

            drawText("Sistem Filsafat", 80, 70, "bold 14px Arial", "#fbbf24");
            drawText(`${data.icon} ${data.name}`, 80, 100, "bold 36px Arial", "#ffffff");

            // Info Boxes
            drawRoundRect(80, 140, 310, 80, 10, "rgba(15, 23, 42, 0.8)", "#475569");
            drawText("Tokoh Utama", 100, 155, "bold 12px Arial", "#94a3b8");
            drawText(data.tokoh, 100, 175, "bold 20px Arial", "#93c5fd");

            drawRoundRect(410, 140, 310, 80, 10, "rgba(15, 23, 42, 0.8)", "#475569");
            drawText("Fokus Pemikiran", 430, 155, "bold 12px Arial", "#94a3b8");
            drawText(data.focus, 430, 175, "bold 18px Arial", "#ffffff");

            // Content
            drawRoundRect(80, 240, 640, 110, 10, "rgba(51, 65, 85, 0.5)", "#475569");
            drawText("💡 Konsep Utama", 100, 255, "bold 16px Arial", "#fbbf24");
            wrapText(data.concept, 100, 285, 600, 22, "16px Arial", "#e2e8f0");

            drawRoundRect(80, 370, 640, 80, 10, "rgba(49, 46, 129, 0.4)", "#4f46e5");
            drawText("🔄 Penerapan Sehari-hari", 100, 385, "bold 16px Arial", "#a5b4fc");
            wrapText(data.application, 100, 415, 600, 22, "italic 16px Arial", "#cbd5e1");

            addButton("⚔️ MULAI CHALLENGE", 250, 480, 300, 50, "#d97706", "#b45309", "#ffffff", () => {
                state.scene = 'quiz';
            });
        }

        function renderQuiz() {
            const data = darsanaData.find(d => d.id === state.currentLessonId);
            
            drawRoundRect(100, 60, 600, 480, 20, "rgba(30, 41, 59, 0.95)", "#475569", true);
            
            drawText(`Tantangan: ${data.name}`, 130, 80, "bold 14px Arial", "#94a3b8");
            drawText(`⭐ Reward: 100 XP`, 670, 80, "bold 14px Arial", "#fbbf24", "right");

            // Question
            wrapText(data.quiz.q, 400, 130, 500, 30, "bold 24px Arial", "#ffffff", "center");

            // Options
            data.quiz.opts.forEach((opt, idx) => {
                const y = 250 + (idx * 60);
                addButton(opt, 150, y, 500, 50, "#1e293b", "#334155", "#e2e8f0", () => handleQuizAnswer(idx, data.quiz.ans, data));
            });

            addButton("Kembali", 350, 510, 100, 30, "transparent", "#334155", "#94a3b8", () => state.scene = 'lesson');
        }

        function handleQuizAnswer(selected, correct, data) {
            if(selected === correct) {
                let xpGain = 0;
                if(!state.completed.includes(data.id)) {
                    state.completed.push(data.id);
                    state.xp += 100;
                    xpGain = 100;
                }
                showModal("Benar!", `Anda mendapatkan Badge "${data.badge}"${xpGain ? ' & 100 XP' : ''}`, "success", () => state.scene = 'map');
            } else {
                showModal("Kurang Tepat", "Silakan pelajari lagi konsepnya.", "error", () => state.scene = 'lesson');
            }
        }

        function renderFinalQuest() {
            const qData = finalQuestData[state.fqCurrentIndex];
            
            drawRoundRect(100, 60, 600, 480, 20, "rgba(30, 41, 59, 0.95)", "#fbbf24", true);
            
            drawText(`💀 FINAL QUEST 💀`, 400, 90, "bold 20px Arial", "#fbbf24", "center");
            
            drawRoundRect(130, 120, 80, 30, 5, "#1e293b");
            drawText(`Soal: ${state.fqCurrentIndex + 1}/${finalQuestData.length}`, 140, 127, "bold 14px Arial", "#cbd5e1");
            
            drawRoundRect(570, 120, 100, 30, 5, "#1e293b");
            drawText(`❤️ Nyawa: ${state.fqLives}`, 580, 127, "bold 14px Arial", "#f87171");

            wrapText(qData.q, 400, 180, 520, 28, "bold 22px Arial", "#ffffff", "center");

            qData.opts.forEach((opt, idx) => {
                const y = 280 + (idx * 55);
                addButton(`${String.fromCharCode(65 + idx)}. ${opt}`, 150, y, 500, 45, "#1e293b", "#3b82f6", "#e2e8f0", () => {
                    if (idx === qData.ans) {
                        state.fqCurrentIndex++;
                        if (state.fqCurrentIndex >= finalQuestData.length) {
                            state.xp += 500;
                            state.scene = 'result';
                        } else {
                            showModal("Tepat!", "Lanjut ke soal berikutnya.", "success", null);
                        }
                    } else {
                        state.fqLives--;
                        if (state.fqLives <= 0) {
                            showModal("Gagal", "Nyawa habis! Coba lagi dari awal.", "error", () => state.scene = 'map');
                        } else {
                            showModal("Salah", `Sisa nyawa: ${state.fqLives}`, "error", null);
                        }
                    }
                });
            });
        }

        function renderResult() {
            const floatY = Math.sin(state.time * 0.005) * 10;
            
            drawText('🏆', GAME_WIDTH/2, 100 + floatY, '80px Arial', '#fbbf24', 'center');
            
            let gradient = ctx.createLinearGradient(0, 180, 0, 240);
            gradient.addColorStop(0, "#fde68a");
            gradient.addColorStop(1, "#d97706");
            ctx.fillStyle = gradient;
            ctx.font = "black 48px Arial";
            ctx.textAlign = "center";
            ctx.fillText("SELAMAT!", GAME_WIDTH/2, 220);

            drawText("Anda Meraih Gelar:", GAME_WIDTH/2, 260, "bold 24px Arial", "#ffffff", "center");
            drawText("Mahaguru Filsafat", GAME_WIDTH/2, 290, "bold 28px Arial", "#60a5fa", "center");

            drawRoundRect(300, 330, 200, 100, 15, "rgba(30, 41, 59, 0.8)", "#475569");
            drawText("Total Skor", 400, 350, "bold 14px Arial", "#94a3b8", "center");
            drawText(`⭐ ${state.xp}`, 400, 380, "bold 36px Arial", "#fbbf24", "center");

            addButton("MAINKAN ULANG", 300, 470, 200, 50, "#0ea5e9", "#0284c7", "#ffffff", () => {
                state.scene = 'home';
                state.xp = 0;
                state.completed = [];
                state.currentLessonId = null;
            });
        }

        function renderModal() {
            if(!state.modal) return;
            
            // Backdrop
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Box
            drawRoundRect(250, 200, 300, 200, 15, "#1e293b", "#475569", true);
            
            let titleColor = "#60a5fa"; // info
            if(state.modal.type === 'success') titleColor = "#4ade80";
            if(state.modal.type === 'error') titleColor = "#f87171";

            drawText(state.modal.title, 400, 230, "bold 24px Arial", titleColor, "center");
            wrapText(state.modal.msg, 400, 270, 260, 20, "16px Arial", "#e2e8f0", "center");

            // The button uses the main UI loop, so we need to add it to uiElements
            addButton("Lanjut", 325, 330, 150, 40, "#3b82f6", "#2563eb", "#fff", () => {
                const cb = state.modal.onClose;
                state.modal = null;
                if(cb) cb();
            });
        }

        function showModal(title, msg, type, onClose) {
            state.modal = {title, msg, type, onClose};
        }

        // --- INPUT HANDLING ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            // Calculate scale based on actual rendered size vs logical size
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            state.mouseX = (e.clientX - rect.left) * scaleX;
            state.mouseY = (e.clientY - rect.top) * scaleY;
            
            // Cursor changing
            let hovering = false;
            if(!state.modal) {
                for(let el of uiElements) {
                    if(state.mouseX >= el.x && state.mouseX <= el.x + el.w &&
                       state.mouseY >= el.y && state.mouseY <= el.y + el.h) {
                        hovering = true;
                        break;
                    }
                }
            } else {
                // If modal is active, only modal buttons should trigger hover
                hovering = true; // simplifying logic for modal button
            }
            canvas.style.cursor = hovering ? 'pointer' : 'default';
        });

        canvas.addEventListener('click', (e) => {
            // Traverse uiElements backwards (top-most elements first)
            for(let i = uiElements.length - 1; i >= 0; i--) {
                const el = uiElements[i];
                if(state.mouseX >= el.x && state.mouseX <= el.x + el.w &&
                   state.mouseY >= el.y && state.mouseY <= el.y + el.h) {
                    el.onClick();
                    break; // Only click top element
                }
            }
        });

        // --- MAIN LOOP ---
        function drawBackground() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Draw Stars
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            stars.forEach(star => {
                star.y -= star.speed;
                if (star.y < 0) star.y = GAME_HEIGHT;
                
                // Twinkle
                ctx.globalAlpha = 0.5 + Math.sin(state.time * 0.01 + star.x) * 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function gameLoop(timestamp) {
            state.time = timestamp;
            uiElements = []; // Reset clickable regions for this frame

            drawBackground();

            switch(state.scene) {
                case 'home': renderHome(); break;
                case 'tutorial': renderTutorial(); break;
                case 'map': renderMap(); break;
                case 'lesson': renderLesson(); break;
                case 'quiz': renderQuiz(); break;
                case 'finalQuest': renderFinalQuest(); break;
                case 'result': renderResult(); break;
            }

            if (state.modal) {
                // Clear UI elements under modal so they can't be clicked
                uiElements = []; 
                renderModal();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start engine
        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
